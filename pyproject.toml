[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cold-case"
version = "0.1.0"
description = "An AI-powered mystery game with backend-owned game truth"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14,<2",
    "fastapi>=0.115,<1",
    "openai>=2,<3",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.10,<3",
    "sqlalchemy[asyncio]>=2.0,<3",
    "tenacity>=9,<10",
    "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "mypy>=1.14,<2",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<1",
    "pytest-cov>=6,<7",
    "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["cold_case"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["cold_case", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["cold_case"]
